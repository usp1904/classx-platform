<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#FAF9F6" />
    <script>
      (function () {
        try {
          document.documentElement.setAttribute('data-theme', 'light');
          document.documentElement.style.colorScheme = 'light';
          var meta = document.querySelector('meta[name="theme-color"]');
          if (meta) meta.setAttribute('content', '#FAF9F6');
        } catch (e) {}
      })();
    </script>
    <meta name="description" content="Class X mastery platform for CBSE 2026-27: structured NCERT lessons, agentic RAG study workspace, practice, mock tests and revision." />
    <title>ClassX · Class X Study Workbook</title>
    <link rel="manifest" href="%BASE_URL%manifest.json" />
    <meta name="mobile-web-app-capable" content="yes" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
    <script>
      if ('serviceWorker' in navigator) {
        navigator.serviceWorker.register('%BASE_URL%sw.js', { scope: '%BASE_URL%' }).catch(() => {});
      }
    </script>
  </body>
</html>
