services:
  classx-api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: classx-api
    restart: always
    ports:
      - "8787:8787"
    environment:
      - NODE_ENV=production
      - PORT=8787
      - CORS_ORIGIN=${CORS_ORIGIN:-true}
      - OPENAI_API_KEY=${OPENAI_API_KEY:-}
      - OPENROUTER_API_KEY=${OPENROUTER_API_KEY:-}
      - OPENAI_BASE_URL=${OPENAI_BASE_URL:-}
      - TUTOR_MODEL=${TUTOR_MODEL:-}
      - RAG_EMBEDDING_PROVIDER=${RAG_EMBEDDING_PROVIDER:-local}
      - RAG_RERANK_PROVIDER=${RAG_RERANK_PROVIDER:-none}
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8787/api/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    depends_on:
      - redis
      - postgres
    networks:
      - classx-net
    deploy:
      resources:
        limits:
          memory: 1G
        reservations:
          memory: 512M

  redis:
    image: redis:7-alpine
    container_name: classx-redis
    restart: always
    ports:
      - "6379:6379"
    command: redis-server --appendonly yes
    volumes:
      - classx_redis_data:/data
    networks:
      - classx-net
    deploy:
      resources:
        limits:
          memory: 256M

  postgres:
    image: postgres:16-alpine
    container_name: classx-postgres
    restart: always
    environment:
      POSTGRES_DB: classx
      POSTGRES_USER: classx
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-classx}
    ports:
      - "5432:5432"
    volumes:
      - classx_postgres_data:/var/lib/postgresql/data
    networks:
      - classx-net
    deploy:
      resources:
        limits:
          memory: 512M

  nginx:
    image: nginx:alpine
    container_name: classx-nginx
    restart: always
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      classx-api:
        condition: service_healthy
    networks:
      - classx-net
    deploy:
      resources:
        limits:
          memory: 128M

networks:
  classx-net:
    driver: bridge

volumes:
  classx_redis_data:
  classx_postgres_data:
