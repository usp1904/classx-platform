# Local production-parity stack. Source of truth for runtime contract.
# Code currently uses MemoryStore (Redis/Qdrant commented out in server/index.js),
# so no DB services are started here. Re-add them only when the code re-enables them.

services:
  classx-api:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        GIT_SHA: ${GIT_SHA:-dev}
    container_name: classx-api
    restart: always
    ports:
      - "8787:8787"
    environment:
      - NODE_ENV=production
      - PORT=8787
      - HOST=0.0.0.0
      - COOKIE_SECURE=${COOKIE_SECURE:-false}
      - CORS_ORIGIN=${CORS_ORIGIN:-true}
      - SESSION_SECRET=${SESSION_SECRET:-classx-dev-secret-change-me}
      - OPENAI_API_KEY=${OPENAI_API_KEY:-}
      - OPENROUTER_API_KEY=${OPENROUTER_API_KEY:-}
      - OPENAI_BASE_URL=${OPENAI_BASE_URL:-}
      - TUTOR_MODEL=${TUTOR_MODEL:-}
      - RAG_EMBEDDING_PROVIDER=${RAG_EMBEDDING_PROVIDER:-local}
      - RAG_RERANK_PROVIDER=${RAG_RERANK_PROVIDER:-none}
    healthcheck:
      test: ["CMD", "node", "-e", "require('http').get('http://localhost:'+(process.env.PORT||8787)+'/api/health',r=>process.exit(r.statusCode===200?0:1)).on('error',()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    networks:
      - classx-net
    deploy:
      resources:
        limits:
          memory: 1G
        reservations:
          memory: 512M

  nginx:
    image: nginx:alpine
    container_name: classx-nginx
    restart: always
    ports:
      - "80:80"
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      classx-api:
        condition: service_healthy
    networks:
      - classx-net
    deploy:
      resources:
        limits:
          memory: 128M

networks:
  classx-net:
    driver: bridge
