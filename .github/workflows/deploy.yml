name: Deploy Multi-Target Static Sites

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  deploy-gh-pages:
    name: Build & Deploy to GitHub Pages
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    concurrency:
      group: 'pages'
      cancel-in-progress: false
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run verification checks
        run: |
          npm run typecheck
          npm test

      - name: Build static site for GitHub Pages
        run: npm run build:gh-pages
        env:
          NODE_ENV: production
          VITE_BASE_PATH: /classx-platform/
          VITE_STATIC_MOCK: 'true'

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist/gh-pages

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

  deploy-cloudflare:
    name: Build & Deploy to Cloudflare Pages
    runs-on: ubuntu-latest
    concurrency:
      group: 'cloudflare-pages'
      cancel-in-progress: true
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run verification checks
        run: |
          npm run typecheck
          npm test

      - name: Build static site for Cloudflare Pages
        run: npm run build:cloudflare
        env:
          NODE_ENV: production
          VITE_BASE_PATH: /
          VITE_STATIC_MOCK: 'true'

      - name: Verify Cloudflare credentials
        id: check_creds
        run: |
          if [ -z "${{ secrets.CLOUDFLARE_API_TOKEN }}" ] || [ -z "${{ secrets.CLOUDFLARE_ACCOUNT_ID }}" ]; then
            echo "has_creds=false" >> $GITHUB_OUTPUT
            echo "::warning title=Cloudflare Credentials Not Configured::CLOUDFLARE_API_TOKEN or CLOUDFLARE_ACCOUNT_ID is missing. Skipping Cloudflare Pages deployment."
          else
            echo "has_creds=true" >> $GITHUB_OUTPUT
          fi

      - name: Deploy to Cloudflare Pages
        if: steps.check_creds.outputs.has_creds == 'true'
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy dist/cloudflare --project-name=classx-platform --branch=main --commit-dirty=true

      - name: Ensure permanent Cloudflare domain
        if: steps.check_creds.outputs.has_creds == 'true'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_ZONE_ID: ${{ secrets.CLOUDFLARE_ZONE_ID }}
          CLOUDFLARE_CUSTOM_DOMAIN: ${{ secrets.CLOUDFLARE_CUSTOM_DOMAIN }}
          CLOUDFLARE_PROJECT: classx-platform
        run: npm run setup:cloudflare
